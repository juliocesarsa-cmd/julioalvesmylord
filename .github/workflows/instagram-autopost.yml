name: Instagram Autopost

# Robô de publicação automática no Instagram.
# Roda de hora em hora e publica os posts da fila (marketing/automacao/queue.json)
# cujo horário agendado já chegou. Também dá pra rodar manualmente.

on:
  schedule:
    # A cada hora, no minuto 0 (horário UTC). Os horários dos posts ficam no
    # queue.json com fuso -03:00, então a comparação é feita corretamente.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem publicar (1 = sim)"
        required: false
        default: "0"

# Permite que o workflow faça commit do queue.json atualizado (status dos posts).
permissions:
  contents: write

concurrency:
  group: instagram-autopost
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publicar posts agendados
        id: publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          # Interruptor de emergência: crie a variável de repositório PAUSE=1
          # (Settings > Variables) para pausar tudo sem mexer no código.
          PAUSE: ${{ vars.PAUSE }}
        run: node marketing/automacao/publish.mjs

      - name: Notificar por e-mail (se houve publicação ou erro)
        # Só envia se houve atividade e se os secrets de e-mail existem.
        if: >-
          ${{ env.MAIL_USERNAME != '' &&
              (steps.publish.outputs.published != '0' || steps.publish.outputs.errors != '0') }}
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Robô Instagram <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "[Instagram] ${{ steps.publish.outputs.published }} publicado(s), ${{ steps.publish.outputs.errors }} erro(s)"
          body: |
            Execução do robô de publicação automática:

            Publicados: ${{ steps.publish.outputs.published }}
            Erros: ${{ steps.publish.outputs.errors }}

            Detalhes:
            ${{ steps.publish.outputs.summary }}

            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Commit do status atualizado da fila
        run: |
          if [[ -n "$(git status --porcelain marketing/automacao/queue.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add marketing/automacao/queue.json
            git commit -m "chore(autopost): atualiza status da fila [skip ci]"
            git push
          else
            echo "Nada mudou na fila."
          fi
